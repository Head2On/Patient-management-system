services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patient_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: patient-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "Patient Management System"
      APP_VERSION: "1.0.0"
      DEBUG: "True"
      SECRET_KEY: "dd5d2f9f13ce0c3521511faf62a8db44a4e457033c5623e41a4230000000000"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/patient_management"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/patient_management_test"
      REDIS_URL: "redis://redis:6379"
      LOGIN_RATE_LIMIT: "5"
      LOGIN_RATE_WINDOW: "300"
      FIRST_SUPERUSER_PHONE: "9999999999"
      FIRST_SUPERUSER_PASSWORD: "AdminPass123"
      FIRST_SUPERUSER_EMAIL: "admin@hospital.com"
    ports:
      - "8000:8000"

volumes:
  pgdata: